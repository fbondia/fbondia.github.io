{% assign lang = page.lang | default: site.language %}
<div class="language-switcher" aria-label="{% if lang == 'pt' %}Selecionar idioma{% else %}Select language{% endif %}">
  <a class="{% if lang == 'en' %}is-current{% endif %}" href="{{ site.baseurl }}/en/">EN</a>
  <a class="{% if lang == 'pt' %}is-current{% endif %}" href="{{ site.baseurl }}/pt/">PT</a>
</div>
